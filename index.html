const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r10=n=>Math.max(10,Math.round(n/10)*10);
const fmt=n=>Math.round(n).toLocaleString('zh-CN');

function newGame(){

}
const rentAmount=k=>Math.round(1200*Math.pow(1.4,Math.min(k,2))*Math.pow(1.72,Math.max(0,k-2))/100)*100;
const nextRentDay=()=>(S.rentIdx+1)*3;
const sellMult=()=>1+0.15*S.up.network;

function genMarket(){
  CATS.forEach(c=>S.market[c]=1);
  S.news=[];
  if(S.day===1) return;
  S.order=S.day>=20?{cat:pick(unlockedCats()),done:false}:null;
  const n=Math.random()<0.5?1:2;
  const cs=[...unlockedCats()].sort(()=>Math.random()-0.5).slice(0,n);
  cs.forEach(c=>{
    const up=Math.random()<0.55;
    const m=up?pick([1.3,1.5,1.8]):pick([0.6,0.7,0.8]);
    S.market[c]=m;
    S.news.push({up,text:up?pick([`拍卖行传出${c}天价成交，${c}行情大涨`,`南方藏家进城扫货，${c}一货难求`]):pick([`${c}赝品风波发酵，买家纷纷观望`,`有人大批抛售${c}，价格走低`])});
  });
}

function genCustomer(){
  const pool=CUST.filter(x=>!x.from||S.day>=x.from); let wr=Math.random()*pool.reduce((a,x)=>a+(x.w||1),0), c=pool[0];
  for(const x of pool){wr-=(x.w||1); if(wr<=0){c=x;break;}}
  const type=pick(TYPES.filter(t=>!t.from||S.day>=t.from));
  const apparent=r10(rand(type.lo,type.hi));
  const isFake=Math.random()<(S.day===1?c.fake*0.5:Math.min(S.day>=15?0.7:0.6,c.fake+(S.day-1)*0.02));
  const isRare=!isFake&&Math.random()<c.rare;
  const trueV=r10(isFake?apparent*rand(0.04,0.1):isRare?apparent*rand(6,12):apparent*rand(0.8,1.3));
  const spots=SPOTS[type.cat].map(s=>({k:s.k,text:pick(s.ok),bad:false,rare:false,revealed:false}));
  if(isFake){
    const nb=(c.hifi||(S.day>=10&&Math.random()<0.7))?1:(Math.random()<0.5?1:2);
    const idx=[0,1,2].sort(()=>Math.random()-0.5).slice(0,nb);
    idx.forEach(i=>{spots[i].bad=true;spots[i].text=pick(SPOTS[type.cat][i].bad);});
  }
  if(isRare){const i=Math.floor(Math.random()*3);spots[i].rare=true;spots[i].text=RARE_HINT;}
  if(isFake&&lvl()>=4&&Math.random()<0.35){const b=spots.find(x=>x.bad); if(b) b.revealed=true;}
  const w=Math.max(0.05,[0.35,0.2,0.1][S.up.abacus]-(lvl()>=3?0.08:0));
  const center=apparent*rand(0.9,1.1);
  const ask=r10(apparent*rand(...c.askR));
  const floor=Math.min(ask,r10(apparent*rand(...c.floorR)));
  return {c,name:pick(c.names),line:pick(c.lines),ask,floor,pat:c.pat,
    item:{type,name:pick(ERAS)+' '+type.name,apparent,trueV,isFake,isRare,spots,est:[r10(center*(1-w)),r10(center*(1+w))]}};
}

function hud(){
  const left=nextRentDay()-S.day, rent=rentAmount(S.rentIdx);

}
function ticker(){
  const ch=CATS.filter(c=>(S.market[c]||1)!==1);

}
function rentLeftText(){const l=nextRentDay()-S.day;return l===0?'今晚':l+'天后';}
function mkHtml(){return `<div class="mk">${CATS.map(c=>{const m=S.market[c];return `<span class="${m>1?'up':m<1?'down':''}">${c} ×${m.toFixed(1)}</span>`;}).join('')}</div>`;}

function stamp(text,color){

const isTut=()=>S&&S.tut&&S.day===1;
const TUT=[
  {c:'寻常百姓',type:'vase',era:'清中期',app:1600,ask:900,fake:[0],line:'老人留下的'},
  {c:'急用钱',type:'bangle',era:'民国',app:1200,ask:900,line:'急用钱……'},
  {c:'不识货',type:'bowl',era:'清早期',app:500,ask:260,rare:1,line:'老屋翻出来的'}
];
function tutCustomer(i){
  const sp=TUT[i], c=CUST.find(x=>x.t===sp.c), type=TYPES.find(t=>t.id===sp.type), a=sp.app;
  const spots=SPOTS[type.cat].map(x=>({k:x.k,text:x.ok[0],bad:false,rare:false,revealed:false}));
  (sp.fake||[]).forEach(k=>{spots[k].bad=true;spots[k].text=SPOTS[type.cat][k].bad[0];});
  if(sp.rare){spots[1].rare=true;spots[1].text=RARE_HINT;}
  return {c,name:c.names[0],line:sp.line,ask:sp.ask,floor:r10(sp.ask*0.7),pat:c.pat,tut:i,
    item:{type,name:sp.era+' '+type.name,apparent:a,trueV:sp.fake?r10(a*0.06):sp.rare?r10(a*4):r10(a*1.05),isFake:!!sp.fake,isRare:!!sp.rare,spots,est:[r10(a*0.8),r10(a*1.2)]}};
}

}

function dayBanner(){

  document.body.appendChild(d); setTimeout(()=>d.remove(),1700);

function openShop(){
  S.eye=eyeMax(); S.custTotal=5+S.up.sign; S.custIdx=0; S.today={bought:0,sold:0,earn:0}; S.rejects=[];
  if(isTut()) S.custTotal=4;
  S.cur=isTut()?tutCustomer(0):genCustomer(); busy=false; renderCounter();
}

function moodOf(cu){if(cu.mood)return cu.mood;if(cu.pat<cu.c.pat)return 'meh';return cu.c.t==='急用钱'?'sad':'ok';}
function priceGeo(){
  const cu=S.cur,it=cu.item,m=S.market[it.type.cat],sm=sellMult();
  const lo=r10(it.est[0]*m*sm),hi=r10(it.est[1]*m*sm),max=Math.max(hi,cu.ask,cu.shownAsk||0)*1.18;
  return {lo,hi,p:v=>Math.max(4,Math.min(96,v/max*100))};
}
function renderCounter(){
  const cu=S.cur,it=cu.item,m=S.market[it.type.cat],eyeMx=eyeMax(),g=priceGeo(),hs=HS[it.type.cat];
  const from=g.p(cu.shownAsk||cu.ask),to=g.p(cu.ask),hagP=Math.max(cu.floor,r10(cu.ask*0.9));
  if(cu.ask0==null) cu.ask0=cu.ask;
  const cut=cu.ask0-cu.ask, canBar=!cu.c.noHag&&!cu.locked&&cu.pat>0;
  const bl=g.p(g.lo),bh=g.p(g.hi),combo=S.combo||0;
  app.innerHTML=hud()+ticker()+`
  <div class="scene2">${custSVG(cu.c,moodOf(cu))}<div><div class="tag2">${cu.c.t}</div><div class="bub" id="bubble">${cu.line}</div></div>
    <div class="pdots">${Array.from({length:cu.c.pat},(_,i)=>`<span class="pdot ${i<cu.pat?'on':i<cu.pat+(cu.lost||0)?'lost':''}"></span>`).join('')}</div></div>
  <div class="stage"><div class="ibox" id="ibox">
    <div class="iname2 serif">${it.name}</div>
    <div class="catTag" style="background:${CAT_COLOR[it.type.cat]}">${it.type.cat}${m!==1?`<span class="mv" style="color:${m>1?'#c0392b':'#2e8b57'}">${m>1?'↑':'↓'}${m.toFixed(1)}</span>`:''}</div>
    <div class="big">${itemSVG(it.type.id)}</div>
    ${S.order&&!S.order.done&&S.order.cat===it.type.cat?'<div class="ordTag">委托要货</div>':''}
    ${it.spots.map((s,i)=>{const x=hs[i][0],y=hs[i][1];return s.revealed
      ?`<button id="hs${i}" class="hs r ${s.bad?'bad':s.rare?'gold':'ok'} ${cu.justRev===i?'pop':''}" style="left:${x}%;top:${y}%" onclick="toast('${s.k}：${s.text}')">${s.bad?'假':s.rare?'宝':'✓'}<span class="k">${s.k}</span></button>`
      :`<button id="hs${i}" class="hs" style="left:${x}%;top:${y}%" ${S.eye<=0?'disabled':''} onclick="inspect(${i})">?</button>`;}).join('')}
    <div class="eyeTag">${LENS}<span class="eye">${'●'.repeat(S.eye)}${'○'.repeat(Math.max(0,eyeMx-S.eye))}</span></div>
  </div></div>
  <div class="deal2">
    <div class="pbar" id="pbar"><div class="rail"></div><div class="band" style="left:${bl}%;width:${bh-bl}%"></div>
      <div class="askMk" id="askMk" style="left:${from}%"><div class="p">¥${fmt(cu.ask)}</div><div class="stem"></div></div></div>
    <div class="blab">${bh-bl<26?`<span style="left:${(bl+bh)/2}%">¥${fmt(g.lo)}~${fmt(g.hi)}</span>`:`<span style="left:${bl}%">¥${fmt(g.lo)}</span><span style="left:${bh}%">¥${fmt(g.hi)}</span>`}</div>
    <div class="btns2">
      ${canBar?`<button id="bHag" class="btn ghost" onclick="haggle()">还价<span class="s">${cu.ask<=cu.floor&&cu.hitFloor?'到底价了':'¥'+fmt(hagP)}</span></button>
      <button id="bSlash" class="btn slashB" ${cu.slashed?'disabled':''} onclick="slash()">狠砍<span class="s">${cu.slashed?'砍过了':combo>=2?'连砍 ×'+combo:'赌一把'}</span></button>`
      :`<div class="lockNote ${cu.locked?'lockCrit':''}" style="grid-column:1/3">${cu.c.noHag?'一口价，不还价':cu.locked?'暴击价已锁定，收不收？':'没耐心了，就这个价'}</div>`}
      <button id="bRej" class="btn gray" onclick="reject()">不要</button>
      <button id="bBuy" class="btn ${cut>0&&cu.ask<=S.cash?'hot':''}" ${cu.ask>S.cash?'disabled':''} onclick="offer(1)">${cu.ask>S.cash?'钱不够':'收'}<span class="s">¥${fmt(cu.ask)}${cut>0?' · 省'+fmt(cut):''}</span></button>
    </div>
  </div>`;
  if(from!==to) requestAnimationFrame(()=>requestAnimationFrame(()=>{const e=document.getElementById('askMk');if(e)e.style.left=to+'%';}));
  cu.shownAsk=cu.ask; cu.justRev=null; cu.lost=0;
  save('counter'); coach();
}
function say(t){const b=document.getElementById('bubble');if(b)b.textContent=t;}

function inspect(i){
  if(busy||S.eye<=0)return;
  const cu=S.cur,s=cu.item.spots[i]; if(s.revealed)return;
  S.eye--; s.revealed=true; cu.justRev=i;
  if(s.bad){cu.line='（眼神躲闪）';chime('fake');}
  else if(s.rare){cu.line='（一脸茫然）';chime('good');}
  else chime('tick');
  renderCounter();
}
function offer(f){
  if(busy)return;
  if(f<1){haggle();return;}
  const cu=S.cur; if(cu.ask>S.cash){toast('现金不够');return;}
  cu.line=pick(cu.c.accept); cu.mood='ok'; renderCounter(); buy(cu.ask);
}
function haggle(){
  if(busy)return;
  const cu=S.cur; if(cu.c.noHag||cu.locked||cu.pat<=0)return;
  cu.pat--; cu.lost=1;
  if(cu.ask<=cu.floor){cu.hitFloor=1; cu.line='真不能再少了'; cu.mood='mad';}
  else{
    const t=r10(cu.ask*0.9);
    if(t>=cu.floor){cu.ask=t; cu.line=pick(cu.c.haggle); cu.mood='meh';}
    else{cu.ask=cu.floor; cu.hitFloor=1; cu.line='最多 ¥'+fmt(cu.ask); cu.mood='meh';}
    chime('tick');
  }
  renderCounter();
}
function leave(){
  const cu=S.cur; cu.line=pick(cu.c.angry); cu.mood='mad'; S.combo=0; cu.done=true;
  renderCounter(); busy=true;
  const b=document.getElementById('bubble'); if(b) b.classList.add('shake');
  setTimeout(nextCustomer,1100);
}
function slash(){
  if(busy)return;
  const cu=S.cur; if(cu.c.noHag||cu.locked||cu.slashed||cu.pat<=0)return;
  busy=true; cu.slashed=1;
  const combo=S.combo||0;
  const chance=Math.min(0.85,cu.c.slash*(0.55+0.45*cu.pat/cu.c.pat)+0.06*Math.min(combo,3)+(lvl()>=5?0.1:0));
  const win=cu.tut===1||Math.random()<chance, sup=cu.tut!==1&&win&&Math.random()<(cu.c.t==='不识货'?0.2:0.12);
  chime('slash'); slashFx();
  setTimeout(()=>{
    busy=false;
    if(win){
      const price=r10(cu.ask*(sup?rand(0.3,0.4):rand(0.52,0.65)));
      const off=Math.round((1-price/cu.ask)*100);
      S.combo=combo+1; S.stats.crits=(S.stats.crits||0)+1;
      cu.pat--; cu.lost=1; cu.locked=1;
      cu.mood='shock'; cu.line=pick(cu.c.crit); cu.ask=price;
      renderCounter(); critFx(sup,off,S.combo);
    }else{
      S.combo=0; cu.pat=Math.max(0,cu.pat-1); cu.lost=1;
      chime('fail'); missFx();
      app.classList.add('shake'); setTimeout(()=>app.classList.remove('shake'),400);
      if(cu.pat<=0){leave();return;}
      cu.mood='mad'; cu.line='你抢钱啊？'+(cu.pat===1?'（快没耐心了）':''); renderCounter();
    }
  },280);
}
function slashFx(){
  const b=document.getElementById('ibox'), r=b?b.getBoundingClientRect():{top:innerHeight*0.45,height:0};
  const d=document.createElement('div'); d.className='slashFx'; d.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),400);
}
function critFx(sup,off,combo){
  const d=document.createElement('div'); d.className='crit'+(sup?' super':'');
  d.innerHTML=`<div class="t serif">${sup?'超级暴击':'暴击'}</div><div class="d">-${off}%</div>${combo>=2?`<br><div class="c">连砍 ×${combo}</div>`:''}`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1550);
  const fl=document.createElement('div'); fl.className='hitflash'+(sup?' gold':''); document.body.appendChild(fl); setTimeout(()=>fl.remove(),300);
  app.classList.remove('bigshake'); void app.offsetWidth; app.classList.add('bigshake'); setTimeout(()=>app.classList.remove('bigshake'),500);
  burst(sup?130:70,sup?['#e2b73f','#fff1b8','#ffd34d','#b8322a']:['#ff5a3c','#ffd77a','#b8322a','#fff3d8'],sup,0.4);
  if(sup) rain(45);
  chime(sup?'super':'crit');
  if(navigator.vibrate) navigator.vibrate(sup?[40,30,40,30,140]:[30,30,90]);
}
function missFx(){
  const d=document.createElement('div'); d.className='crit miss'; d.innerHTML='<div class="t serif">没砍动</div>';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1200);
}
function floatT(t,color){
  const d=document.createElement('div'); d.className='floatT'; d.style.color=color||'#ffd77a'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1100);
}
function buy(price,delay){
  busy=true;
  S.cash-=price; S.stats.bought++; S.today.bought++;
  S.inv.push({...S.cur.item,paid:price,day:S.day});
  floatT('收货 -¥'+fmt(price),'#fff3d8');
  S.cur.done=true; save('counter'); clearCoach();
  setTimeout(nextCustomer,delay||1100);
}
function reject(){
  if(busy)return; busy=true; const cu=S.cur,it=cu.item;
  const spotted=it.spots.some(x=>x.revealed&&x.bad);
  const r={name:it.name,typeId:it.type.id,cat:it.type.cat,isFake:it.isFake,isRare:it.isRare,trueV:it.trueV,ask:cu.ask,spotted};
  if(spotted){
    const bounty=r10(it.apparent*0.1*(lvl()>=5?2:1)); r.bounty=bounty;
    S.cash+=bounty; S.stats.caught=(S.stats.caught||0)+1;
    cu.line='被你看穿了……'; cu.mood='sad';
  } else {cu.line='那我走了'; cu.mood='meh';}
  (S.rejects=S.rejects||[]).push(r);
  cu.done=true; renderCounter(); busy=true;
  if(spotted){stamp('识破','#3b6d11');chime('good');floatT('识破赝品 赏金 +¥'+fmt(r.bounty),'#c9f29b');gainXP(2);}
  setTimeout(nextCustomer,spotted?1100:700);
}
function gainXP(n){
  const before=lvl(); S.xp=Math.max(0,(S.xp||0)+n);
  const after=lvl(); if(after>before) setTimeout(()=>levelUpFx(after),600);
}
function levelUpFx(l){
  const d=document.createElement('div'); d.className='lvBan';

function xpText(){const l=lvl();return l>=LV.length?'满级':`${S.xp||0}/${LV[l].xp}`;}
function openLevel(){
  const l=lvl(), nx=l>=LV.length?null:LV[l], pr=LV[l-1];
  const pct=nx?Math.round(((S.xp||0)-pr.xp)/(nx.xp-pr.xp)*100):100;
  sheet(`<div class="sheetHead"><span class="serif">鉴宝等级</span><button class="x" onclick="closeOv(this)">关闭</button></div>
    <div class="card" style="text-align:left">Lv${l} ${pr.n} · 经验 ${xpText()}<div class="xpbar"><div style="width:${pct}%"></div></div>
    <span class="meta">识破赝品 +2 · 躲过赝品 +1 · 当天没打眼 +1 · 收到重器 +3</span></div>
    <div class="stats" style="margin:10px 0">
      <div class="stat"><div class="n">${S.stats.caught||0}</div><div class="l">识破赝品</div></div>
      <div class="stat"><div class="n">${S.streak||0} 天</div><div class="l">连续没打眼</div></div></div>
    <div class="lvList">${LV.map((x,i)=>`<div class="row ${i<l?'on':'off'}"><b>Lv${i+1}</b><span>${x.n}${x.p?' · '+x.p:''}</span></div>`).join('')}</div>`);
}
function settleDay(){
  if(S.today.settled) return; S.today.settled=true;
  let dx=0;
  (S.rejects||[]).forEach(r=>{
    if(r.spotted){r.v='catch';return;}
    if(r.isFake){r.v='dodge';dx++;S.stats.dodged=(S.stats.dodged||0)+1;return;}
    r.miss=r10(r.trueV*(S.market[r.cat]||1)*sellMult())-r.ask;
    r.v=r.isRare?'rare':'miss';
    if(r.isRare)(S.missed=S.missed||[]).push({name:r.name.replace(' ',' 御制'),typeId:r.typeId,v:r.miss+r.ask});
  });
  if(dx) gainXP(dx);
}
function rejectRows(){
  const L=S.rejects||[]; if(!L.length) return '';
  const vd=r=>r.v==='catch'?`识破 +¥${fmt(r.bounty)}`:r.v==='dodge'?'赝品 · 躲过了':r.v==='rare'?`重器！错失 ¥${fmt(Math.max(0,r.miss))}`:r.miss>0?`真品 · 少赚 ¥${fmt(r.miss)}`:'真品 · 价高不亏';
  const n=L.filter(r=>r.isFake).length;
  return `<div class="label" style="margin-bottom:-6px">拒收揭晓 · ${n}/${L.length} 件是赝品</div><div>${L.map(r=>`<div class="rjRow v-${r.v}"><div class="pic">${itemSVG(r.typeId)}</div><div class="nm serif">${r.name}</div><div class="vd">${vd(r)}</div></div>`).join('')}</div>`;
}
function nextCustomer(){
  S.custIdx++; busy=false;
  if(S.custIdx>=S.custTotal){settleDay();renderClose();return;}
  S.cur=isTut()&&S.custIdx<TUT.length?tutCustomer(S.custIdx):genCustomer(); renderCounter();
}

      <div style="display:flex;flex-direction:column;gap:4px">${S.order&&!S.order.done&&S.order.cat===it.type.cat?`<button class="btn small gold" onclick="sell(${i},1)">交委托</button>`:''}<button id="sell${i}" class="btn small" onclick="sell(${i})">出手</button></div></div>`).join(''):'<div class="empty">库房空空如也</div>'}</div>

    <button id="bClose" class="btn big" onclick="endDay()">打 烊</button>

function sell(i,ord){
  if(busy)return;
  const it=S.inv[i], prevBest=S.stats.best; let v=sellValue(it);
  if(ord){S.order.done=true; v=it.isFake?0:r10(v*1.5);}
  const p=v-it.paid;
  S.cash+=v; S.inv.splice(i,1); S.stats.profit+=p; S.stats.sold++; S.today.sold++; S.today.earn+=p;
  if(p>S.stats.best){S.stats.best=p;S.stats.bestName=it.name;}
  const kind=it.isFake?'fake':it.isRare?'rare':(p>=1000&&v>=it.paid*2)?'big':p>=Math.max(200,it.paid*0.5)?'good':p<0?'loss':'small';
  const e={id:++S.lid,day:S.day,fk:it.isFake,name:it.isRare?it.name.replace(' ',' 御制'):it.name,typeId:it.type.id,paid:it.paid,sold:v,profit:p,kind,recordBreak:p>prevBest&&prevBest>0};
  S.ledger.push(e);
  if(kind==='fake') S.stats.fakes++;
  if(kind==='rare'){S.stats.rares++;gainXP(3);}
  if(ord&&it.isFake) gainXP(-3);
  renderClose();
  if(ord&&!it.isFake&&kind!=='rare'&&kind!=='big'){stamp('交付','#a8770a');chime('good');burst(50,['#e2b73f','#fff1b8'],true,0.45);toast(`藏家满意，1.5 倍收购 ¥${fmt(v)}`);return;}
  if(ord&&it.isFake){stamp('被识破','#555');chime('fake');toast('藏家一眼看穿是赝品，分文未给');return;}
  if(kind==='rare'||kind==='big'){addHall(e);showReveal(e);if(kind==='rare'&&isTut())setTimeout(()=>toast('不识货的客人手里，偶尔藏着这样的重器'),2600);}
  else if(kind==='good'){stamp('捡漏','#b8322a');chime('good');burst(40,['#b8322a','#e2b73f'],true,0.45);toast(`卖出 ¥${fmt(v)}，赚 ¥${fmt(p)}`);}
  else if(kind==='fake'){stamp('打眼了','#555');chime('fake');app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),400);toast(`赝品！只卖了 ¥${fmt(v)}，亏 ¥${fmt(-p)}`);}
  else if(kind==='loss') toast(`卖出 ¥${fmt(v)}，亏了 ¥${fmt(-p)}`);
  else toast(`卖出 ¥${fmt(v)}，小赚 ¥${fmt(p)}`);
}
function endDay(){
  if(busy)return;
  clearCoach();
  let msg='';
  if(isTut()){S.tut=false;localStorage.setItem('jl_tut_done','1');msg+='新手教学完成！之后的客人都要靠你自己判断了。';}
  if(S.day===nextRentDay()){
    const rent=rentAmount(S.rentIdx);
    if(S.cash<rent&&S.inv.length){
      let sum=0; S.inv.forEach(it=>{const v=r10(sellValue(it)*0.7);sum+=v;S.stats.profit+=v-it.paid;
        S.ledger.push({id:++S.lid,day:S.day,name:it.name,typeId:it.type.id,paid:it.paid,sold:v,profit:v-it.paid,kind:'forced',fk:it.isFake});}); S.inv=[]; S.cash+=sum;
      msg+=`现金不够交租，库存被迫七折贱卖，换回 ¥${fmt(sum)}。`;
    }
    if(S.cash<rent){gameOver(rent,rent-S.cash);return;}
    S.cash-=rent; S.rentIdx++; msg+=`已交房租 ¥${fmt(rent)}。`;
  }
  const sold=S.ledger.filter(e=>e.day===S.day);
  if(sold.some(e=>e.fk)) S.streak=0;
  else if(sold.length){S.streak=(S.streak||0)+1; gainXP(S.streak>=3?2:1); if(S.streak>=3) msg+=`火眼金睛，连续 ${S.streak} 天没打眼！`;}
  renderUpgrade(msg);
}
function renderUpgrade(msg){
  if(msg!==undefined) S.upMsg=msg; msg=S.upMsg||'';
  app.innerHTML=hud()+`<div class="screen">
    <div class="secTitle serif">第 ${S.day} 天 · 打烊</div>
    <div class="card">今天收货 ${S.today.bought} 件，出手 ${S.today.sold} 件，净赚 <b class="${S.today.earn>=0?'up':'down'}">¥${fmt(S.today.earn)}</b>${msg?'<br>'+msg:''}
      <br>下次交租：第 ${nextRentDay()} 天，<b>¥${fmt(rentAmount(S.rentIdx))}</b>
      <br><span class="meta">鉴宝 Lv${lvl()} ${LV[lvl()-1].n} · 经验 ${xpText()}${S.streak?` · 火眼 ${S.streak} 天`:''}</span></div>
    ${(()=>{const b=bestOf(S.ledger.filter(e=>e.day===S.day));return b?`<div class="label" style="margin-bottom:-6px">今日最得意的一笔</div>${entryRow(b)}`:'';})()}
    ${S.day<2?'<div class="tip">明天打烊后，就能添置家当了</div>':`<div class="label" style="margin-bottom:-6px">添置家当</div>
    ${UPS.map(u=>{const lv=S.up[u.k],max=lv>=u.cost.length,c=max?0:u.cost[lv];

      <button class="btn small ${max?'gray':'gold'}" ${max||S.cash<c?'disabled':''} onclick="buyUp('${u.k}')">${max?'已满级':'¥'+fmt(c)}</button></div>`;}).join('')}`}
    <button class="btn big" onclick="nextDay()">明天见</button>

function buyUp(k){const u=UPS.find(x=>x.k===k),lv=S.up[k];if(lv>=u.cost.length||S.cash<u.cost[lv])return;S.cash-=u.cost[lv];S.up[k]++;toast(`添置了${u.name}`);renderUpgrade();}
function nextDay(){S.day++;genMarket();renderDayStart();}

function gameOver(rent,short){
  clearSave(); clearCoach();
  const d=S.day;
  const rank=d<=4?'学徒':d<=8?'伙计':d<=12?'掌柜':d<=18?'大掌柜':'鉴宝宗师';
  const best=JSON.parse(localStorage.getItem('jl_best')||'null');
  const isNew=!best||d>best.days||(d===best.days&&S.stats.best>best.best);
  if(isNew) localStorage.setItem('jl_best',JSON.stringify({days:d,best:S.stats.best}));
  app.innerHTML=`<div class="screen center">
    <div class="label">交不起 ¥${fmt(rent)} 的房租，当铺关门了</div>
    <div class="rank serif">${rank}</div>
    <div class="sub">撑到了第 ${d} 天${isNew?' · <b class="up">新纪录</b>':best&&best.days>d?` · 离最佳纪录还差 ${best.days-d} 天`:''}</div>
    ${short?`<div class="near">就差 <b>¥${fmt(short)}</b>，就交上房租了</div>`:''}
    ${(()=>{const m=(S.missed||[]).sort((a,b)=>b.v-a.v)[0];
      if(m) return `<div class="regret"><div class="pic">${itemSVG(m.typeId)}</div><div>你拒收的那件<b>${m.name}</b>，其实是重器，值 <b>¥${fmt(m.v)}</b></div></div>`;
      const f=S.ledger.filter(e=>e.kind==='fake').sort((a,b)=>a.profit-b.profit)[0];
      return f?`<div class="regret"><div class="pic">${itemSVG(f.typeId)}</div><div>最痛的一笔：花 <b>¥${fmt(f.paid)}</b> 收的${f.name}，是赝品</div></div>`:'';})()}
    <button class="btn big" onclick="startGame()">再开一家，这次撑过第 ${d} 天</button>
    <div class="stats">
      <div class="stat"><div class="n">¥${fmt(S.stats.best)}</div><div class="l">最大一笔捡漏</div></div>
      <div class="stat"><div class="n">${S.stats.rares}</div><div class="l">捡到重器</div></div>
      <div class="stat"><div class="n">${S.stats.bought}</div><div class="l">收货件数</div></div>
      <div class="stat"><div class="n">${S.stats.fakes}</div><div class="l">打眼次数</div></div>
      <div class="stat"><div class="n">${S.stats.caught||0}</div><div class="l">识破赝品</div></div>
      <div class="stat"><div class="n">Lv${lvl()}</div><div class="l">鉴宝 · ${LV[lvl()-1].n}</div></div>
    </div>
    ${(()=>{const b=bestOf(S.ledger);return b?`<div class="label" style="margin-bottom:-6px;text-align:left">本局最得意的一笔</div>${entryRow(b)}`:'';})()}
    <div class="share">我在《捡漏当铺》撑到第 ${d} 天，${S.stats.best>0?`最狠一次收${S.stats.bestName}净赚 ¥${fmt(S.stats.best)}，`:''}识破赝品 ${S.stats.caught||0} 件，鉴宝 Lv${lvl()}。你能比我眼毒吗？</div>
    <button class="btn ghost" onclick="openLedger()">查看本局账本（${S.ledger.length} 笔）</button>
    <button class="btn ghost" onclick="renderTitle()">回到首页</button>
  </div>`;
}

let COACH=null;
const HAND='<svg viewBox="0 0 40 48"><path d="M14 5a4 4 0 0 1 8 0v15l2-1a4 4 0 0 1 4.5 1.2l.5.8a4 4 0 0 1 5.5 2.5V35c0 7-5 12-12 12h-3c-5 0-8-3-10-7L4 31a3.5 3.5 0 0 1 6-4l4 4z" fill="#fffaf0" stroke="#3a2614" stroke-width="2.5" stroke-linejoin="round"/></svg>';
function clearCoach(){COACH=null;document.querySelectorAll('.cRing,.cHand,.cTip').forEach(e=>e.remove());}
function showCoach(o){
  const same=COACH&&COACH.sel===o.sel&&COACH.text===o.text;
  COACH=o; if(same){placeCoach();return;}
  document.querySelectorAll('.cRing,.cHand,.cTip').forEach(e=>e.remove());
  const el=document.querySelector(o.sel); if(!el){COACH=null;return;}
  const r=el.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) el.scrollIntoView({block:'center'});
  const ring=document.createElement('div'); ring.className='cRing';
  const hand=document.createElement('div'); hand.className='cHand'; hand.innerHTML=HAND;
  const tip=document.createElement('div'); tip.className='cTip'; tip.innerHTML=o.text+(o.btn?`<button onclick="tutAck()">${o.btn}</button>`:'');
  document.body.append(ring,hand,tip); placeCoach(); chime('tick');
}
function placeCoach(){
  if(!COACH)return; const el=document.querySelector(COACH.sel);
  const ring=document.querySelector('.cRing'),hand=document.querySelector('.cHand'),tip=document.querySelector('.cTip');
  if(!el||!ring)return;
  const r=el.getBoundingClientRect(), pad=6, round=el.classList.contains('hs');
  Object.assign(ring.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px',borderRadius:round?'50%':'14px'});
  const cx=r.left+r.width/2, cy=r.top+r.height/2, low=cy>innerHeight*0.55, noHand=!!COACH.btn;
  hand.style.display=noHand?'none':'block';
  const big=r.height>40;
  if(low){hand.classList.add('up');hand.querySelector('svg').style.transform='rotate(180deg)';hand.style.left=cx-22+'px';hand.style.top=(big?r.top-40:cy-52)+'px';}
  else{hand.classList.remove('up');hand.querySelector('svg').style.transform='';hand.style.left=cx-18+'px';hand.style.top=(big?r.bottom-8:cy+2)+'px';}
  tip.style.top=tip.style.bottom='';
  if(low) tip.style.bottom=(innerHeight-r.top+pad+(noHand?10:56))+'px'; else tip.style.top=(r.bottom+pad+(noHand?10:56))+'px';
}
function tutAck(){if(S&&S.cur){S.cur.tutBar=1;save('counter');}coach();}
function coach(){
  if(!isTut()){clearCoach();return;}
  if(S.screen==='counter'){
    const cu=S.cur; if(!cu||cu.done||busy){clearCoach();return;}
    const sp=cu.item.spots;
    if(cu.tut===0) return showCoach(!sp[0].revealed?{sel:'#hs0',text:'第一位客人。先<b>验货</b>：点这个 ?',lock:1}:{sel:'#bRej',text:'是<b>假货</b>！点「不要」当面识破，有赏金',lock:1});
    if(cu.tut===1) return showCoach(!cu.tutBar?{sel:'#pbar',text:'红标是<b>要价</b>，绿段是真品<b>行价</b><br>红标落在绿段里，就不亏',btn:'懂了',lock:1}:!cu.locked?{sel:'#bSlash',text:'急用钱的客人好砍——<b>狠砍</b>，赌一把！',lock:1}:{sel:'#bBuy',text:'砍到<b>暴击价</b>了！砍价不等于成交，点「收」才算买下',lock:1});
    if(cu.tut===2) return showCoach(!sp[1].revealed?{sel:'#hs1',text:'这件有点不一样……<b>验一下</b>',lock:1}:{sel:'#bBuy',text:'<b>宝光！</b>他不识货，赶紧收下',lock:1});
    clearCoach();
    if(!cu.tutHint){cu.tutHint=1;setTimeout(()=>toast('这位交给你了，自己判断！'),300);}
    return;
  }
  if(S.screen==='close'){
    const ri=S.inv.findIndex(x=>x.isRare);
    if(ri>=0) return showCoach({sel:'#sell'+ri,text:'出手看看，它到底值多少？',lock:1});
    if(S.inv.length) return showCoach({sel:'#sell0',text:'剩下的货也出手吧'});
    return showCoach({sel:'#bClose',text:'打烊，结算今天'});
  }
  clearCoach();
}
document.addEventListener('click',e=>{
  if(!COACH||!COACH.lock)return;
  const t=e.target, el=document.querySelector(COACH.sel);

window.addEventListener('resize',placeCoach);

/* ---------- 账本 / 珍宝阁 ---------- */
const BADGE={rare:['重器','b-rare'],big:['大捡漏','b-big'],good:['捡漏','b-good'],fake:['赝品','b-fake'],forced:['贱卖','b-forced'],loss:['亏','b-loss']};
const bestOf=L=>{const c=L.filter(e=>e.profit>0);return c.length?c.reduce((a,b)=>b.profit>a.profit?b:a):null;};
function entryRow(e,src){
  const b=BADGE[e.kind], tap=(e.kind==='rare'||e.kind==='big');
  const call=src==='hall'?`replayH(${e._i})`:`replayL(${e.id})`;
  return `<div class="lrow k-${e.kind} ${tap?'tap':''}" ${tap?`onclick="${call}"`:''}>
    <div class="pic">${itemSVG(e.typeId)}</div>
    <div class="info"><div class="iname serif">${e.name}${b?`<span class="badge ${b[1]}">${b[0]}</span>`:''}</div>
      <div class="meta">${e.date?e.date:'第'+e.day+'天'} · 收 ¥${fmt(e.paid)} → 卖 ¥${fmt(e.sold)}${tap?' · <span class="replay">点击回看</span>':''}</div></div>
    <div class="pf ${e.profit>=0?'up':'down'}">${e.profit>=0?'+':'-'}¥${fmt(Math.abs(e.profit))}</div></div>`;
}
function todayRows(){
  const L=S.ledger.filter(e=>e.day===S.day);
  if(!L.length) return '';
  const sum=L.reduce((a,e)=>a+e.profit,0);
  return `<div class="label" style="margin-bottom:-6px">今日成交 · 合计 <b class="${sum>=0?'up':'down'}">${sum>=0?'+':'-'}¥${fmt(Math.abs(sum))}</b></div><div>${[...L].reverse().map(e=>entryRow(e)).join('')}</div>`;
}
function sheet(html){
  const ov=document.createElement('div'); ov.className='ov sheetOv';
  ov.onclick=ev=>{if(ev.target===ov) ov.remove();};
  ov.innerHTML=`<div class="sheet">${html}</div>`; document.body.appendChild(ov);
}
function closeOv(el){const o=el.closest('.ov'); if(o) o.remove();}
function openLedger(){
  const L=S.ledger, sum=L.reduce((a,e)=>a+e.profit,0);
  const top=L.filter(e=>e.profit>0).sort((a,b)=>b.profit-a.profit).slice(0,3);
  sheet(`<div class="sheetHead"><span class="serif">账本</span><button class="x" onclick="closeOv(this)">关闭</button></div>
    <div class="stats">
      <div class="stat"><div class="n ${sum>=0?'':'down'}">${sum>=0?'':'-'}¥${fmt(Math.abs(sum))}</div><div class="l">累计盈亏</div></div>
      <div class="stat"><div class="n">${L.length}</div><div class="l">出手件数</div></div>
      <div class="stat"><div class="n">${L.filter(e=>e.kind==='rare').length}</div><div class="l">捡到重器</div></div>
      <div class="stat"><div class="n">${L.filter(e=>e.kind==='fake').length}</div><div class="l">打眼次数</div></div>
    </div>
    ${top.length?`<div class="label">高光时刻</div>${top.map(e=>entryRow(e)).join('')}`:''}
    <div class="label">全部记录（最新在前）</div>
    ${L.length?[...L].reverse().map(e=>entryRow(e)).join(''):'<div class="empty">还没卖出过东西，收市时出手的每一笔都会记在这里</div>'}`);
}
const hallList=()=>JSON.parse(localStorage.getItem('jl_hall')||'[]');
function addHall(e){
  const h=hallList(); h.push({...e,date:new Date().toLocaleDateString('zh-CN')});
  h.sort((a,b)=>b.profit-a.profit); localStorage.setItem('jl_hall',JSON.stringify(h.slice(0,10)));
}
function openHall(){
  const h=hallList().map((e,i)=>({...e,_i:i}));
  sheet(`<div class="sheetHead"><span class="serif">珍宝阁</span><button class="x" onclick="closeOv(this)">关闭</button></div>
    <div class="tip" style="text-align:left">历次开店中最得意的十笔交易（重器与大捡漏），点击可回看当时的场面</div>
    <div style="margin-top:10px">${h.length?h.map(e=>entryRow(e,'hall')).join(''):'<div class="empty">还没有藏品。收到重器或大捡漏后，会被陈列在这里</div>'}</div>`);
}
function replayL(id){const e=S.ledger.find(x=>x.id===id); if(e) showReveal(e,true);}
function replayH(i){const e=hallList()[i]; if(e) showReveal(e,true);}

/* ---------- 揭晓动画 ---------- */
let REV=null;
function showReveal(e,replay){
  REV=e;
  const rare=e.kind==='rare';
  document.querySelectorAll('.reveal').forEach(x=>x.remove());
  const ov=document.createElement('div'); ov.className='ov reveal '+(rare?'gold':'red');
  ov.innerHTML=`<div class="flash"></div><div class="rays"></div>
    <div class="rcard">
      <div class="rtitle serif">${rare?'捡到宝了':'大捡漏'}</div>
      <div class="rsub">${rare?'不识货的客人手里，竟是一件御制重器！':'眼毒手快，这一单赚翻了！'}</div>
      <div class="rpic">${itemSVG(e.typeId)}</div>
      <div class="rname serif">${e.name}</div>
      <div class="rflow"><span>收价 ¥${fmt(e.paid)}</span><span>→</span><span>卖出 ¥${fmt(e.sold)}</span></div>
      <div class="rprofit serif">+¥<span class="cnt">0</span></div>
      <div class="rmul">翻了 <b>${(e.sold/Math.max(1,e.paid)).toFixed(1)}</b> 倍${e.recordBreak&&!replay?' · <b>刷新本局最大一笔</b>':''}</div>
      <div class="rbtns"><button class="btn gold" onclick="copyText(shareText(REV))">炫耀一下</button><button class="btn" onclick="closeOv(this);coach()">${replay?'关闭':'收进账本'}</button></div>
    </div>`;
  document.body.appendChild(ov);
  const cnt=ov.querySelector('.cnt'), pr=ov.querySelector('.rprofit'), bt=ov.querySelector('.rbtns');
  chime(rare?'rare':'big');
  if(navigator.vibrate) navigator.vibrate(rare?[60,40,60,40,160]:[50,30,90]);
  setTimeout(()=>burst(rare?50:30,['#e2b73f','#fff1b8'],false,0.42),250);
  countUp(cnt,e.profit,rare?1600:1200,()=>{
    pr.classList.add('pop');
    burst(rare?150:90,rare?['#e2b73f','#fff1b8','#ffd34d','#b8322a']:['#b8322a','#e2b73f','#f08a6a'],true,0.42);
    if(rare) rain(70);
    chime('ding');
  });
  setTimeout(()=>bt.classList.add('show'),rare?1900:1500);
}
function countUp(el,to,ms,done){
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/ms),q=1-Math.pow(1-k,3);el.textContent=fmt(to*q);if(k<1)requestAnimationFrame(f);else done&&done();})(t0);
}
function shareText(e){
  const url=location.href.split('?')[0].split('#')[0];
  return `我在《捡漏当铺》花 ¥${fmt(e.paid)} 收了件${e.name}，${e.kind==='rare'?'竟然是件御制重器，':''}转手卖了 ¥${fmt(e.sold)}，翻了 ${(e.sold/Math.max(1,e.paid)).toFixed(1)} 倍！来试试你的眼力：${url}`;
}
function copyText(t){
  const ok=()=>toast('已复制，发给朋友炫耀一下吧');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(_){toast(t);} ta.remove();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok,fb); else fb();
}

/* ---------- 粒子 ---------- */
let fxCv=null,fxCtx=null,parts=[],fxRaf=0;
function fxInit(){
  if(!fxCv){fxCv=document.createElement('canvas');fxCv.className='fxcv';document.body.appendChild(fxCv);fxCtx=fxCv.getContext('2d');}
  const d=window.devicePixelRatio||1;
  if(fxCv.width!==innerWidth*d){fxCv.width=innerWidth*d;fxCv.height=innerHeight*d;}
  fxCtx.setTransform(d,0,0,d,0,0);
}
function burst(n,pal,coins,yr){
  fxInit(); const cx=innerWidth/2, cy=innerHeight*(yr||0.42);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=rand(3,12);
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(2,6),g:rand(0.16,0.3),r:rand(5,10),rot:rand(0,6.3),vr:rand(-0.3,0.3),coin:coins&&Math.random()<0.45,c:pick(pal),life:rand(80,140)});}
  if(!fxRaf) fxRaf=requestAnimationFrame(fxLoop);
}
function rain(n){
  fxInit();
  for(let i=0;i<n;i++) parts.push({x:rand(0,innerWidth),y:rand(-innerHeight*0.6,-20),vx:rand(-0.6,0.6),vy:rand(2,5),g:0.08,r:rand(7,11),rot:rand(0,6.3),vr:rand(-0.15,0.15),coin:true,c:'#e2b73f',life:400});
  if(!fxRaf) fxRaf=requestAnimationFrame(fxLoop);
}
function fxLoop(){
  const c=fxCtx; c.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.vy+=p.g;p.vx*=0.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.min(1,p.life/30);
    if(p.coin){c.scale(Math.abs(Math.cos(p.rot*2))*0.7+0.3,1);c.fillStyle='#e2b73f';c.beginPath();c.arc(0,0,p.r,0,7);c.fill();c.lineWidth=1.5;c.strokeStyle='#9a7424';c.stroke();c.fillStyle='#8a6418';c.fillRect(-p.r*0.3,-p.r*0.3,p.r*0.6,p.r*0.6);}
    else{c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}
    c.restore();
  }
  if(parts.length) fxRaf=requestAnimationFrame(fxLoop); else {fxRaf=0;c.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------- 音效 ---------- */
let actx=null;
const muted=()=>localStorage.getItem('jl_mute')==='1';
function toggleMute(){localStorage.setItem('jl_mute',muted()?'0':'1');renderTitle();}
function tone(f,t,dur,type,vol,f2){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+0.05);
}
function chime(kind){
  if(muted())return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    if(kind==='slash'){tone(1800,t0,0.18,'sawtooth',0.07,160);return;}
    if(kind==='fail'){tone(220,t0,0.3,'square',0.05,110);return;}
    if(kind==='tick'){tone(1320,t0,0.12,'triangle',0.1);return;}
    if(kind==='crit'||kind==='super'){
      tone(150,t0,0.35,'sine',0.5,45);
      (kind==='super'?[523,784,1047,1319,1568,2093]:[784,1047,1568]).forEach((f,i)=>tone(f,t0+0.05+i*0.06,0.5,'triangle',0.15));
      return;
    }
    const N={rare:[523,659,784,1047,1319,1568],big:[523,659,784,1047],good:[784,1175],fake:[233,175],ding:[1568,2093]}[kind]||[880];
    N.forEach((f,i)=>tone(f,t0+i*(kind==='ding'?0.06:0.09),0.6,kind==='fake'?'square':'triangle',kind==='fake'?0.05:0.16));
  }catch(_){}
}
/* ---------- 存档 ---------- */
const SAVE_KEY='jl_save_v1';
function save(screen){
  if(!S) return; S.screen=screen;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(_){}
}
function readSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return d&&d.day?d:null;}catch(_){return null;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(_){}}
const screenName=k=>({day:'开门前',counter:'营业中',close:'收市中',upgrade:'已打烊'}[k]||'');
function relinkItem(it){it.type=TYPES.find(t=>t.id===it.type.id)||it.type;return it;}
function continueGame(){
  const d=readSave(); if(!d){renderTitle();return;}
  S=d; busy=false;
  S.xp=S.xp||0; S.streak=S.streak||0; S.rejects=S.rejects||[]; S.seenCh=S.seenCh||[]; if(S.order===undefined) S.order=null;
  S.stats.caught=S.stats.caught||0; S.stats.dodged=S.stats.dodged||0; CATS.forEach(c=>{if(S.market[c]==null)S.market[c]=1;});
  S.inv.forEach(relinkItem);
  if(S.cur){relinkItem(S.cur.item); S.cur.c=CUST.find(c=>c.t===S.cur.c.t)||S.cur.c;}
  if(S.cur&&S.cur.c&&!S.cur.c.lines) S.cur.c=CUST.find(c=>c.t===S.cur.c.t)||S.cur.c;
  if(S.screen==='counter'){ if(S.cur&&!S.cur.done) renderCounter(); else nextCustomer(); }
  else if(S.screen==='close') renderClose();
  else if(S.screen==='upgrade') renderUpgrade();
  else renderDayStart();
  toast('已读取存档，欢迎回来，掌柜的');
}
function newGameConfirm(){
  if(confirm('重新开张会清空当前这局的存档（珍宝阁和最佳纪录会保留），确定吗？')){clearSave();startGame();}
}
window.addEventListener('pagehide',()=>{if(S&&S.screen&&readSave()) save(S.screen);});
renderTitle();
</script>
